# Weekly refresh of data/tv/ (episode lists, next-episode dates) from TVmaze,
# so the countdown pages and binge totals stay current without anyone touching
# the repo. Commits the new JSON, then kicks the Pages deploy explicitly — a
# push made with GITHUB_TOKEN doesn't trigger other workflows on its own.
name: Refresh show data

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-shows
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch from TVmaze
        run: node scripts/fetch-shows.mjs
      - name: Commit if anything changed
        id: commit
        run: |
          git add data/tv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh show data from TVmaze"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
